<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排位結果 — 展覽位置預定系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
    <script src="/site-config.js"></script>
    <style>
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }
        .floorplan-legend-row {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .floorplan-legend-row .legend { margin-top: 0; }
        .floorplan-actions {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .floorplan-actions { flex-direction: column; align-items: flex-start; }
        }
        .unsubmitted { color: var(--muted); font-style: italic; }
        .rank-badge {
            display: inline-block;
            font-size: 11px;
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: 4px;
            padding: 1px 6px;
            margin-left: 4px;
        }
        .proj-tab {
            padding: 6px 14px; border-radius: 20px; font-size: 13px;
            border: 1px solid var(--border); background: var(--surface);
            cursor: pointer; color: var(--text);
        }
        .proj-tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    </style>
</head>
<body>
<nav>
    <a href="/" class="site-name" id="site-name-link">展覽位置預定系統</a>
    <div class="nav-links">
        <a href="/result.html" class="active">排位結果</a>
        <a href="/book.html" id="nav-book">填寫志願</a>
        <a href="/verify-lottery.html">驗證抽籤</a>
        <span class="nav-user" id="nav-user"></span>
        <a href="#" id="nav-logout" style="color:var(--danger);display:none">登出</a>
    </div>
</nav>

<main class="wide">

    <!-- 結果主體（公開頁面，不需登入） -->
    <div id="result-body">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px">
            <div>
                <h1 style="margin-bottom:2px" id="page-title">排位結果</h1>
                <p class="page-subtitle" style="margin:0" id="update-subtitle">每 30 秒自動更新 &nbsp;·&nbsp; <span id="last-update">—</span></p>
            </div>
            <button class="btn btn-ghost btn-sm" id="download-verification-btn" style="display:none" onclick="downloadVerificationData()">下載驗證資料（JSON）</button>
        </div>
        <p id="verification-hash-line" class="page-subtitle" style="display:none;margin:0 0 4px;word-break:break-all;font-family:monospace;font-size:11px"></p>
        <p id="anon-name-notice" class="page-subtitle" style="margin:0 0 8px;display:none">未登入時，姓名會部分遮蔽以保護隱私；登入後可看到完整姓名。</p>

        <!-- 專案選擇 -->
        <div id="proj-tabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px"></div>

        <div id="time-banner" class="alert"></div>
        <div id="pre-draw-banner" class="alert alert-info" style="display:none">🎲 本專案採抽籤制，以下顯示的是目前的<b>登記狀況</b>，尚未抽籤，不代表最終分配結果</div>

        <!-- 平面圖 -->
        <div class="card" style="padding:16px; margin-bottom:16px">
            <div class="floorplan-container">
                <div class="floorplan-wrap" id="floorplan-wrap">
                    <img id="floorplan-img" alt="展館平面圖" style="display:block;width:100%;height:auto">
                    <svg id="marker-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                    <div id="floorplan-placeholder" style="display:none;padding:40px;text-align:center;color:var(--muted)">平面圖尚未設定</div>
                </div>
            </div>
            <div class="floorplan-legend-row" style="margin-top:10px">
                <div class="legend" id="result-legend">
                    <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>我的位置</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>已分配</div>
                    <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>
                </div>
                <div class="floorplan-actions">
                    <button class="btn btn-ghost btn-sm" id="download-floorplan-btn" style="display:none" onclick="downloadFloorplanImage()">下載目前畫面（JPEG）</button>
                    <button class="btn btn-ghost btn-sm" id="view-manual-log-btn" style="display:none" onclick="viewManualLog()">查看調整紀錄</button>
                </div>
            </div>
        </div>

        <!-- 手動調整歷史紀錄（公開版，不含操作者身分） -->
        <div class="card" id="manual-log-panel" style="display:none; margin-bottom:16px">
            <h3 style="margin-bottom:4px">手動調整紀錄</h3>
            <p style="font-size:12px; color:var(--muted); margin:0 0 10px">
                以下為抽籤／時間排序結果之外，管理員額外調整位置的紀錄（例如補位、同學協調後交換），不影響原始抽籤結果。
            </p>
            <div id="manual-log-body" style="font-size:13px;line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px"></div>
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px">
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('manual-log-panel').style.display='none'">關閉</button>
            </div>
        </div>

        <!-- 結果表格 -->
        <div class="result-grid">
            <div class="card">
                <h2 id="student-table-title">學生分配狀況</h2>
                <div id="student-table">載入中…</div>
            </div>
            <div class="card">
                <h2 id="wall-table-title">位置分配狀況</h2>
                <div id="wall-table">載入中…</div>
            </div>
        </div>
    </div>
</main>

<footer>
    © <span id="yr"></span> <span id="footer-org">hui.gallery</span> &nbsp;·&nbsp; 如需技術協助，請洽 <a id="footer-contact" href="mailto:service@hui.gallery">service@hui.gallery</a>
    &nbsp;·&nbsp; <a href="/example.html">抽籤範例說明</a>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
document.getElementById('site-name-link').textContent = SITE_CONFIG.siteName;
document.title = `排位結果 — ${SITE_CONFIG.siteName}`;
document.getElementById('footer-org').textContent = SITE_CONFIG.orgName;
document.getElementById('footer-contact').href = `mailto:${SITE_CONFIG.contactEmail}`;
document.getElementById('footer-contact').textContent = SITE_CONFIG.contactEmail;

// 支援學生帳號（localStorage）或管理員帳號（sessionStorage）
const isAdmin = !!sessionStorage.getItem('hui_admin_token');
const token = isAdmin
    ? sessionStorage.getItem('hui_admin_token')
    : localStorage.getItem('hui_token');
const myName = isAdmin
    ? ('管理員' + (sessionStorage.getItem('hui_admin_role') === 'superadmin' ? '（超）' : ''))
    : localStorage.getItem('hui_name');
const expiresAt = parseInt(
    (isAdmin ? sessionStorage.getItem('hui_admin_expires_at') : localStorage.getItem('hui_expires_at')) || '0'
);

if (token && expiresAt && Date.now() / 1000 > expiresAt) {
    if (isAdmin) { sessionStorage.removeItem('hui_admin_token'); sessionStorage.removeItem('hui_admin_expires_at'); }
    else { localStorage.removeItem('hui_token'); localStorage.removeItem('hui_name'); localStorage.removeItem('hui_expires_at'); }
}
// 每分鐘檢查一次是否過期
setInterval(() => {
    const exp = parseInt((isAdmin ? sessionStorage.getItem('hui_admin_expires_at') : localStorage.getItem('hui_expires_at')) || '0');
    if (exp && exp < Date.now() / 1000) {
        if (isAdmin) { sessionStorage.clear(); window.location.href = '/admin.html'; }
        else { localStorage.clear(); window.location.href = '/'; }
    }
}, 60000);

// 公開頁面，不需登入即可查看；有登入時才顯示個人化資訊（我的位置、完整姓名）
const isLoggedIn = !!token && !(expiresAt && Date.now() / 1000 > expiresAt);

if (isLoggedIn) {
    const navUser = document.getElementById('nav-user');
    if (isAdmin) {
        navUser.innerHTML = `<a href="/admin.html" style="color:var(--text)">${myName || '管理員'}</a>`;
        document.getElementById('nav-book').style.display = 'none';
    } else {
        navUser.textContent = myName || '';
    }
    document.getElementById('nav-logout').style.display = '';
} else {
    document.getElementById('anon-name-notice').style.display = '';
}

// 依登入狀態 × 是否為抽籤前登記狀況，決定圖例文字
function renderLegend(isPreDraw) {
    const el = document.getElementById('result-legend');
    if (isPreDraw) {
        el.innerHTML = `
            <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>已有人登記</div>
            <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>尚無人登記</div>`;
    } else if (isLoggedIn && isAdmin) {
        el.innerHTML = `
            <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>已分配（管理員檢視，無我的位置）</div>
            <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>
            <div class="legend-item"><div class="legend-dot" style="background:#7c3aed;border-radius:2px;transform:rotate(45deg)"></div>管理員手動調整</div>`;
    } else if (isLoggedIn) {
        el.innerHTML = `
            <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>我的位置</div>
            <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>已分配</div>
            <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>
            <div class="legend-item"><div class="legend-dot" style="background:#7c3aed;border-radius:2px;transform:rotate(45deg)"></div>管理員手動調整</div>`;
    } else {
        el.innerHTML = `
            <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>已分配</div>
            <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>
            <div class="legend-item"><div class="legend-dot" style="background:#7c3aed;border-radius:2px;transform:rotate(45deg)"></div>管理員手動調整</div>`;
    }
}

init();

document.getElementById('nav-logout')?.addEventListener('click', e => {
    e.preventDefault();
    if (isAdmin) { sessionStorage.clear(); window.location.href = '/admin.html'; }
    else { localStorage.clear(); window.location.href = '/'; }
});

// 未登入時遮蔽姓名：沒有空格（中文名/含學號）保留頭尾字元、中間全遮；
// 有空格（英文名）保留第一個空格前的字串，其餘整段換成一個 X
function maskName(name) {
    if (name.includes(' ')) {
        const i = name.indexOf(' ');
        return name.slice(0, i) + ' X';
    }
    const chars = [...name];
    const n = chars.length;
    if (n <= 1) return name;
    if (n === 2) return chars[0] + 'Ｘ';
    return chars[0] + 'Ｘ'.repeat(n - 2) + chars[n - 1];
}

function displayName(name) {
    return isLoggedIn ? name : maskName(name);
}

// 平面圖標記專用：管理員可設定「顯示名稱」覆蓋平面圖上的姓名（因為學生註冊時
// 不強制用本名），只有登入時才套用，未登入維持原本的遮蔽邏輯不受影響。
let displayNames = {};
function floorplanLabel(name) {
    return isLoggedIn ? (displayNames[name] || name) : maskName(name);
}

let WALLS = {};
let selectedProjectId = null;
let openProjects = [];
let lastDrawn = false;
let currentVerification = null;
let currentProjectName = '';

async function init() {
    // 載入開放中的專案列表
    try {
        const r = await fetch('/api/open-projects');
        if (r.ok) {
            openProjects = (await r.json()).projects || [];
            renderProjTabs();
            if (openProjects.length > 0) {
                selectProject(openProjects[0].id);
            }
        }
    } catch { /* 忽略 */ }
}

function renderProjTabs() {
    const el = document.getElementById('proj-tabs');
    if (openProjects.length <= 1) { el.style.display = 'none'; return; }
    el.innerHTML = openProjects.map(p =>
        `<button class="proj-tab" id="tab-${p.id}" onclick="selectProject(${p.id})">${esc(p.name)}</button>`
    ).join('');
}

function selectProject(projectId) {
    selectedProjectId = projectId;
    lastDrawn = false;
    document.getElementById('manual-log-panel').style.display = 'none';
    document.querySelectorAll('.proj-tab').forEach(t => t.classList.remove('active'));
    const tab = document.getElementById(`tab-${projectId}`);
    if (tab) tab.classList.add('active');

    const proj = openProjects.find(p => p.id === projectId);
    const isLottery = proj?.allocation_mode === 'lottery';
    const closed = !isLottery && proj?.close_at && Date.now() / 1000 > proj.close_at;
    document.getElementById('update-subtitle').innerHTML = closed
        ? '志願已截止'
        : '每 30 秒自動更新 &nbsp;·&nbsp; <span id="last-update">—</span>';

    // 切換專案時，如果先前因為抽籤完成/已截止而永久停止過，換到別的專案要恢復自動更新
    refreshStopped = false;
    startRefreshTimer();
    refresh();
}

// 只有本站上傳（同源）的圖片能合成下載，外部連結（Google Drive／Imgur）畫進 canvas
// 會導致 canvas 被瀏覽器標記為「受污染」，之後 toBlob() 匯出會直接被擋下。
function isLocalFloorplan(url) {
    return typeof url === 'string' && url.startsWith('/') && !url.startsWith('//');
}

// 把目前畫面上的平面圖 + SVG 標記層合成一張 JPEG 下載。SVG 裡的標記座標是依照
// wrap 的「目前顯示尺寸」算出來的像素值，所以合成到原圖解析度時要另外設定
// viewBox 為 wrap 的顯示尺寸，讓內容依比例縮放到目標寬高，而不是直接被裁切。跟
// admin.html 同一份邏輯。
async function downloadFloorplanImage() {
    const img = document.getElementById('floorplan-img');
    const svgEl = document.getElementById('marker-svg');
    const wrap = document.getElementById('floorplan-wrap');
    if (!img.naturalWidth) return;

    const W = img.naturalWidth, H = img.naturalHeight;
    const renderedW = wrap.offsetWidth, renderedH = wrap.offsetHeight;

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);

    const clone = svgEl.cloneNode(true);
    clone.removeAttribute('style');
    clone.setAttribute('width', W);
    clone.setAttribute('height', H);
    clone.setAttribute('viewBox', `0 0 ${renderedW} ${renderedH}`);
    // var(--text)/var(--card) 只有在還連在頁面 DOM 上時才能被瀏覽器解析；序列化成獨立的
    // SVG 文件後失去頁面的 CSS 內容，var() 會直接失效變成黑色，導致姓名文字跟底色都變黑，
    // 疊在一起完全看不見。下載前先把這兩個變數換成當下實際套用的顏色。
    const rootStyle = getComputedStyle(document.documentElement);
    const resolvedText = rootStyle.getPropertyValue('--text').trim() || '#1c2830';
    const resolvedCard = rootStyle.getPropertyValue('--card').trim() || '#eae6df';
    clone.querySelectorAll('[fill="var(--text)"]').forEach(el => el.setAttribute('fill', resolvedText));
    clone.querySelectorAll('[fill="var(--card)"]').forEach(el => el.setAttribute('fill', resolvedCard));
    const svgUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' }));

    try {
        await new Promise((resolve, reject) => {
            const svgImg = new Image();
            svgImg.onload = () => { ctx.drawImage(svgImg, 0, 0, W, H); resolve(); };
            svgImg.onerror = reject;
            svgImg.src = svgUrl;
        });
    } catch {
        return;
    } finally {
        URL.revokeObjectURL(svgUrl);
    }

    canvas.toBlob((blob) => {
        if (!blob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `平面圖_${currentProjectName || '結果'}.jpg`;
        a.click();
        URL.revokeObjectURL(a.href);
    }, 'image/jpeg', 0.92);
}
window.downloadFloorplanImage = downloadFloorplanImage;

// 在文字標籤後面加一個貼合大小的底色方塊，避免平面圖底色太花讓文字看不清楚。
// 必須在 textEl 已經接到（已在畫面上的）svg 之後才能呼叫，getBBox() 才量得到
// 正確尺寸；rect 會插在 textEl 前面，讓底色畫在文字下面。
function addLabelBackground(g, textEl) {
    const bbox = textEl.getBBox();
    const padX = 3, padY = 1.5;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', bbox.x - padX);
    rect.setAttribute('y', bbox.y - padY);
    rect.setAttribute('width', bbox.width + padX * 2);
    rect.setAttribute('height', bbox.height + padY * 2);
    rect.setAttribute('rx', 3);
    rect.setAttribute('fill', 'var(--card)');
    rect.setAttribute('fill-opacity', '0.9');
    rect.setAttribute('pointer-events', 'none');
    g.insertBefore(rect, textEl);
}

// 手動調整過的位置畫成菱形（旋轉45度的正方形），跟正式分配結果的圓形區分。
// pos.x/pos.y 是百分比，rotate() 只吃數字不吃百分比，所以先換算成實際像素座標。
function drawWallDiamond(g, pos, wrap, size, fillColor) {
    const cxPx = parseFloat(pos.x) / 100 * wrap.offsetWidth;
    const cyPx = parseFloat(pos.y) / 100 * wrap.offsetHeight;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', cxPx - size / 2);
    rect.setAttribute('y', cyPx - size / 2);
    rect.setAttribute('width', size);
    rect.setAttribute('height', size);
    rect.setAttribute('fill', fillColor);
    rect.setAttribute('stroke', '#fff'); rect.setAttribute('stroke-width', '1.5');
    rect.setAttribute('transform', `rotate(45 ${cxPx} ${cyPx})`);
    g.appendChild(rect);
}

function renderMarkers(taken, manualWalls) {
    const svg = document.getElementById('marker-svg');
    svg.innerHTML = '';
    const wrap = document.getElementById('floorplan-wrap');
    const r = Math.max(10, Math.min(16, wrap.offsetWidth * 0.016));
    const fs = Math.round(r * 0.85);

    for (const [id, pos] of Object.entries(WALLS)) {
        const wallId = parseInt(id);
        const assignedTo = taken[wallId];
        const isManual = manualWalls?.has(id) || manualWalls?.has(String(wallId));
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        svg.appendChild(g);

        const isMe = !isAdmin && assignedTo && assignedTo === myName;
        const fillColor = isMe
            ? '#16a34a'
            : assignedTo ? (isAdmin ? '#16a34a' : '#d97706') : 'rgba(120,120,120,0.45)';

        if (isManual) {
            drawWallDiamond(g, pos, wrap, (isMe ? r * 1.15 : r) * 1.7, '#7c3aed');
        } else {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', pos.x + '%'); circle.setAttribute('cy', pos.y + '%');
            circle.setAttribute('r', isMe ? r * 1.15 : r);
            circle.setAttribute('fill', fillColor);
            circle.setAttribute('stroke', isMe ? '#fff' : '#fff');
            circle.setAttribute('stroke-width', isMe ? '2.5' : '1.5');
            g.appendChild(circle);
        }

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x + '%'); text.setAttribute('y', pos.y + '%');
        text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff'); text.setAttribute('font-size', fs);
        text.setAttribute('font-family', 'Inter, sans-serif'); text.setAttribute('font-weight', '700');
        text.setAttribute('pointer-events', 'none'); text.textContent = wallId;
        g.appendChild(text);

        if (assignedTo) {
            const nameEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const nameY = parseFloat(pos.y) + (r / wrap.offsetHeight * 100) + 2.5;
            nameEl.setAttribute('x', pos.x + '%'); nameEl.setAttribute('y', nameY + '%');
            nameEl.setAttribute('text-anchor', 'middle'); nameEl.setAttribute('fill', 'var(--text)');
            nameEl.setAttribute('font-size', Math.max(8, fs * 0.75));
            nameEl.setAttribute('font-family', 'Inter, sans-serif'); nameEl.setAttribute('font-weight', '500');
            nameEl.setAttribute('pointer-events', 'none');
            const label = floorplanLabel(assignedTo);
            nameEl.textContent = label.length > 4 ? label.slice(0, 4) + '…' : label;
            g.appendChild(nameEl);
            addLabelBackground(g, nameEl);
        }
    }
}

// 抽籤前的登記狀況：不顯示名字，圓點顏色深淺 + 數字反映登記人數
function renderMarkersRegistrations(registrations) {
    const svg = document.getElementById('marker-svg');
    svg.innerHTML = '';
    const wrap = document.getElementById('floorplan-wrap');
    const r = Math.max(10, Math.min(16, wrap.offsetWidth * 0.016));
    const fs = Math.round(r * 0.85);
    const maxCount = Math.max(1, ...Object.values(registrations).map(list => list.length), 0);

    for (const [id, pos] of Object.entries(WALLS)) {
        const wallId = parseInt(id);
        const count = (registrations[wallId] || []).length;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        svg.appendChild(g);

        const intensity = count ? 0.35 + 0.55 * Math.min(1, count / maxCount) : 0.45;
        const fillColor = count ? `rgba(217,119,6,${intensity})` : 'rgba(120,120,120,0.45)';

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x + '%'); circle.setAttribute('cy', pos.y + '%');
        circle.setAttribute('r', r);
        circle.setAttribute('fill', fillColor);
        circle.setAttribute('stroke', '#fff'); circle.setAttribute('stroke-width', '1.5');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x + '%'); text.setAttribute('y', pos.y + '%');
        text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff'); text.setAttribute('font-size', fs);
        text.setAttribute('font-family', 'Inter, sans-serif'); text.setAttribute('font-weight', '700');
        text.setAttribute('pointer-events', 'none'); text.textContent = wallId;
        g.appendChild(circle); g.appendChild(text);

        if (count) {
            const countEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const countY = parseFloat(pos.y) + (r / wrap.offsetHeight * 100) + 2.5;
            countEl.setAttribute('x', pos.x + '%'); countEl.setAttribute('y', countY + '%');
            countEl.setAttribute('text-anchor', 'middle'); countEl.setAttribute('fill', 'var(--text)');
            countEl.setAttribute('font-size', Math.max(8, fs * 0.75));
            countEl.setAttribute('font-family', 'Inter, sans-serif'); countEl.setAttribute('font-weight', '500');
            countEl.setAttribute('pointer-events', 'none');
            countEl.textContent = `${count} 人登記`;
            g.appendChild(countEl);
            addLabelBackground(g, countEl);
        }
    }
}

// 是否為目前登入學生自己的名字（管理員視角不特別標示任何人）
function isMyName(name) {
    return !isAdmin && !!myName && name === myName;
}

// 用醒目樣式包住名字/標籤文字，方便學生在長名單中快速找到自己
function highlightName(label) {
    return `<b style="color:var(--accent-fg);background:var(--accent);padding:1px 6px;border-radius:4px">${label}</b>`;
}

function renderStudentTable(submissions, results, allUsers, isPreDraw) {
    const el = document.getElementById('student-table');
    document.getElementById('student-table-title').textContent = isPreDraw ? '學生登記狀況' : '學生分配狀況';
    if (!allUsers.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無資料</p>'; return; }
    const sortedUsers = [...allUsers].sort((a, b) => {
        const sa = submissions[a], sb = submissions[b];
        if (sa && sb) return sa.submitted_at - sb.submitted_at;
        if (sa) return -1;
        if (sb) return 1;
        return 0;
    });
    const headCol = isPreDraw ? '已登記志願｜格式：位置編號' : '分配位置';
    let html = `<table><thead><tr><th>姓名</th><th>${headCol}</th><th>提交時間</th></tr></thead><tbody>`;
    for (const name of sortedUsers) {
        const sub = submissions[name];
        const rowAttr = isMyName(name) ? ' style="background:rgba(58,122,110,0.14)"' : '';
        const nameCell = isMyName(name) ? highlightName(esc(displayName(name))) : esc(displayName(name));
        if (sub) {
            const d = new Date(sub.submitted_at * 1000);
            const time = d.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit' });
            let statusCol;
            if (isPreDraw) {
                statusCol = sub.prefGroups.map(g => g.join('+')).join('、');
            } else {
                const r = results[name];
                const rankLabel = r?.rank ? `<span class="rank-badge">第${r.rank}志願</span>` : '';
                const manualBadge = r?.manualAssignment
                    ? ` <span title="此為管理員手動調整的位置，非抽籤/時間排序原始結果" style="color:#7c3aed;font-size:11px;cursor:help">◆</span>`
                    : '';
                const wallText = r?.walls?.length ? `位置 ${r.walls.join('+')}${manualBadge}` : '<span style="color:var(--muted)">尚未分配</span>';
                statusCol = `${wallText} ${rankLabel}`;
            }
            html += `<tr${rowAttr}><td>${nameCell}</td><td>${statusCol}</td><td style="color:var(--muted);font-size:13px">${time}</td></tr>`;
        } else {
            html += `<tr${rowAttr}><td>${nameCell}</td><td class="unsubmitted">尚未填寫</td><td>—</td></tr>`;
        }
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

function renderWallTable(taken, results) {
    document.getElementById('wall-table-title').textContent = '位置分配狀況';
    const el = document.getElementById('wall-table');
    const wallIds = Object.keys(WALLS).map(Number).sort((a, b) => a - b);
    if (!wallIds.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無位置資料</p>'; return; }
    let html = '<table><thead><tr><th style="white-space:nowrap">位置</th><th>分配給</th></tr></thead><tbody>';
    for (const id of wallIds) {
        const name = taken[id];
        const manualBadge = name && results?.[name]?.manualAssignment
            ? ` <span title="此為管理員手動調整的位置，非抽籤/時間排序原始結果" style="color:#7c3aed;font-size:11px;cursor:help">◆</span>`
            : '';
        const nameCell = name ? `${esc(displayName(name))}${manualBadge}` : '<span class="unsubmitted">—</span>';
        html += `<tr><td style="white-space:nowrap">位置 ${id}</td><td>${nameCell}</td></tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

// 抽籤前推算：第1志願（含組合位置）完全沒有跟任何人重疊的人，不管抽籤順序為何都一定會拿到，
// 這件事在正式抽籤前就能算出來，不需要種子。只推算到第1志願，第2志願以後牽涉到「有沒有人在
// 第1輪競爭中落敗」，這要等抽籤才能決定，不在推算範圍內，避免給出不可靠的預測。
function computeUncontestedFirstChoice(submissions) {
    const wallClaimants = {};
    for (const [name, sub] of Object.entries(submissions || {})) {
        const combo = sub.prefGroups?.[0];
        if (!combo) continue;
        combo.forEach(w => (wallClaimants[w] ||= new Set()).add(name));
    }
    const uncontested = new Set();
    for (const [name, sub] of Object.entries(submissions || {})) {
        const combo = sub.prefGroups?.[0];
        if (combo && combo.length && combo.every(w => wallClaimants[w].size === 1)) {
            uncontested.add(name);
        }
    }
    return uncontested;
}

function renderWallTableRegistrations(registrations, submissions) {
    document.getElementById('wall-table-title').textContent = '位置登記狀況';
    const el = document.getElementById('wall-table');
    const wallIds = Object.keys(WALLS).map(Number).sort((a, b) => a - b);
    if (!wallIds.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無位置資料</p>'; return; }
    const uncontested = computeUncontestedFirstChoice(submissions);
    let html = '<table><thead><tr><th style="white-space:nowrap">位置</th><th>登記名單｜格式：帳號（志願序），✓ = 第1志願無人競爭（僅供參考，正式結果仍以抽籤為準）</th></tr></thead><tbody>';
    for (const id of wallIds) {
        // 先依志願序排（第1志願優先），同志願序內再依姓名排序
        const list = [...(registrations[id] || [])].sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, 'zh-Hant'));
        const names = list.map(({ name, rank }) => {
            const mark = (rank === 1 && uncontested.has(name)) ? ' ✓' : '';
            const label = `${esc(displayName(name))}（${rank}）${mark}`;
            return isMyName(name) ? highlightName(label) : label;
        }).join('、');
        html += `<tr><td style="white-space:nowrap">位置 ${id}</td><td>${names || '<span class="unsubmitted">—</span>'}</td></tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 驗證用雜湊（SHA-256）：邏輯須與 admin.html、verify-lottery.html 保持一致，否則同一份資料會算出不同雜湊值 ──
function canonicalizeForHash(value) {
    if (Array.isArray(value)) return '[' + value.map(canonicalizeForHash).join(',') + ']';
    if (value && typeof value === 'object') {
        return '{' + Object.keys(value).sort().map(k => JSON.stringify(k) + ':' + canonicalizeForHash(value[k])).join(',') + '}';
    }
    return JSON.stringify(value);
}
async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function computeVerificationHash(payload) {
    return sha256Hex(canonicalizeForHash(payload));
}

// 顯示開放/截止時間狀態，以及結果頁面自動關閉時間（若有設定）
function renderTimeBanner(project) {
    const banner = document.getElementById('time-banner');
    const now = Math.floor(Date.now() / 1000);
    const fmt = ts => new Date(ts * 1000).toLocaleString('zh-Hant', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const autoCloseSuffix = project.active_until ? `，結果頁面將於 ${fmt(project.active_until)} 後自動關閉` : '';

    let cls, text;
    if (project.open_at && now < project.open_at) {
        cls = 'alert-warning';
        text = `⏰ 尚未開放填寫志願，開放時間：${fmt(project.open_at)}${autoCloseSuffix}`;
    } else if (project.close_at && now > project.close_at) {
        cls = 'alert-error';
        text = `🔒 志願填寫已於 ${fmt(project.close_at)} 截止${autoCloseSuffix}`;
    } else if (project.open_at || project.close_at) {
        cls = 'alert-info';
        const parts = [];
        if (project.open_at) parts.push(`開放：${fmt(project.open_at)}`);
        if (project.close_at) parts.push(`截止：${fmt(project.close_at)}`);
        text = `📅 ${parts.join('　')}${autoCloseSuffix}`;
    } else if (autoCloseSuffix) {
        cls = 'alert-info';
        text = `📅 結果頁面將於 ${fmt(project.active_until)} 後自動關閉`;
    } else {
        banner.className = 'alert';
        return;
    }
    banner.className = `alert show ${cls}`;
    banner.textContent = text;
}

async function updateVerificationHash() {
    const el = document.getElementById('verification-hash-line');
    if (!currentVerification) { el.style.display = 'none'; return; }
    const hash = await computeVerificationHash({ projectName: currentProjectName, ...currentVerification });
    el.textContent = `驗證雜湊值：${hash}`;
    el.style.display = '';
}

// 下載抽籤驗證資料（JSON），任何人（不需登入）都能下載，拿去 verify-lottery.html 重新驗算
function downloadVerificationData() {
    if (!currentVerification) return;
    const payload = { projectName: currentProjectName, ...currentVerification };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `抽籤驗證資料_${currentProjectName}.json`;
    a.click();
}
window.downloadVerificationData = downloadVerificationData;

// 查看手動調整歷史紀錄（公開版，任何人不需登入即可查看，不含操作者身分）
async function viewManualLog() {
    if (!selectedProjectId) return;
    try {
        const r = await fetch(`/api/manual-assignments-log?projectId=${selectedProjectId}`);
        const data = await r.json();
        if (!r.ok) return;
        const body = document.getElementById('manual-log-body');
        if (!data.records.length) {
            body.innerHTML = '<p style="color:var(--muted);margin:0">這個專案還沒有任何手動調整紀錄</p>';
        } else {
            const rows = data.records.map(rec => {
                const when = new Date(rec.assignedAt * 1000).toLocaleString('zh-Hant');
                return `<tr>
                    <td>${esc(displayName(rec.userName))}</td>
                    <td>位置 ${rec.walls.join('+')}</td>
                    <td>${esc(rec.reason)}</td>
                    <td style="white-space:nowrap;color:var(--muted)">${when}</td>
                </tr>`;
            }).join('');
            body.innerHTML = `<div style="overflow-x:auto"><table><thead><tr><th>學生</th><th>調整為</th><th>原因</th><th>時間</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        }
        document.getElementById('manual-log-panel').style.display = '';
    } catch { /* 靜默失敗 */ }
}
window.viewManualLog = viewManualLog;

async function refresh() {
    if (!selectedProjectId) return;
    try {
        // 登入時附上 token，讓後端可以套用較短的快取時間（未登入者則套用較長的快取時間）
        const r = await fetch(`/api/result?projectId=${selectedProjectId}`, {
            headers: isLoggedIn ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!r.ok) return;
        const { allocationMode, drawn, taken, results, registrations, submissions, verification, allUsers, project, displayNames: dn } = await r.json();
        displayNames = dn || {};

        lastDrawn = drawn;
        const isPreDraw = allocationMode === 'lottery' && !drawn;
        document.getElementById('pre-draw-banner').style.display = isPreDraw ? '' : 'none';
        renderLegend(isPreDraw);

        currentVerification = verification;
        currentProjectName = project?.name || '';
        document.getElementById('download-verification-btn').style.display = verification ? '' : 'none';
        updateVerificationHash();

        // 有被手動調整過的位置（補位或交換來的），畫成菱形跟正式分配結果區分
        const manualWalls = new Set();
        for (const r of Object.values(results || {})) {
            if (r.manualAssignment) (r.walls || []).forEach(w => manualWalls.add(String(w)));
        }
        document.getElementById('view-manual-log-btn').style.display = manualWalls.size ? '' : 'none';

        // 下載合成圖只限本站上傳的圖片（同源，/ 開頭的相對路徑）；Google Drive／Imgur
        // 這類外部連結畫進 canvas 會被瀏覽器標記為「受污染」，匯出時會被擋下，所以不提供
        document.getElementById('download-floorplan-btn').style.display =
            project && isLocalFloorplan(project.floorplan_url) ? '' : 'none';

        if (project) {
            renderTimeBanner(project);
            WALLS = project.walls || {};
            const img = document.getElementById('floorplan-img');
            const svgEl = document.getElementById('marker-svg');
            const placeholder = document.getElementById('floorplan-placeholder');
            const draw = () => isPreDraw ? renderMarkersRegistrations(registrations) : renderMarkers(taken, manualWalls);
            // 用顯示/隱藏切換，不要用 innerHTML 整個砍掉重建──那樣會連 SVG 標記層一起
            // 摧毀，之後再畫圖（例如自動刷新、切換專案）就會找不到元素而整個掛掉。
            if (img.getAttribute('data-src') !== project.floorplan_url) {
                img.setAttribute('data-src', project.floorplan_url);
                img.onload = () => {
                    img.style.display = ''; svgEl.style.display = ''; placeholder.style.display = 'none';
                    draw();
                };
                img.onerror = () => {
                    img.style.display = 'none'; svgEl.style.display = 'none'; placeholder.style.display = '';
                };
                img.src = project.floorplan_url;
            } else {
                draw();
            }
            document.getElementById('page-title').textContent = project.name ? `${project.name} — 排位結果` : '排位結果';
        }

        renderStudentTable(submissions, results, allUsers, isPreDraw);
        if (isPreDraw) renderWallTableRegistrations(registrations, submissions); else renderWallTable(taken, results);

        const now = new Date();
        document.getElementById('last-update').textContent =
            `更新於 ${now.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    } catch { /* 靜默失敗 */ }
}

document.getElementById('floorplan-img').addEventListener('load', () => renderMarkers({}));

let refreshTimer = null;
let refreshStopped = false; // 抽籤已完成或已截止時永久停止，切回分頁也不恢復

function refreshTick() {
    if (!selectedProjectId) return;
    const proj = openProjects.find(p => p.id === selectedProjectId);
    if (proj?.allocation_mode === 'lottery') {
        // 抽籤制截止後仍持續刷新，直到抽籤完成才停止，讓大家能看到抽籤瞬間切換到結果
        if (lastDrawn) {
            stopRefreshTimer();
            refreshStopped = true;
            document.getElementById('update-subtitle').textContent = '已完成抽籤';
            return;
        }
    } else if (proj?.close_at && Date.now() / 1000 > proj.close_at) {
        stopRefreshTimer();
        refreshStopped = true;
        document.getElementById('update-subtitle').textContent = '志願已截止';
        return;
    }
    refresh();
}

function startRefreshTimer() {
    if (refreshTimer || refreshStopped) return;
    refreshTimer = setInterval(refreshTick, 30000);
}

function stopRefreshTimer() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

startRefreshTimer();

// 分頁切到背景（切走分頁、鎖螢幕）時暫停自動更新，切回前景時立即刷新一次並恢復定時器
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        stopRefreshTimer();
    } else if (!refreshStopped) {
        refresh();
        startRefreshTimer();
    }
});
</script>
