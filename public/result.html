<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排位結果 — 展覽位置預定系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
    <style>
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }
        .unsubmitted { color: var(--muted); font-style: italic; }
        .rank-badge {
            display: inline-block;
            font-size: 11px;
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: 4px;
            padding: 1px 6px;
            margin-left: 4px;
        }
        .proj-tab {
            padding: 6px 14px; border-radius: 20px; font-size: 13px;
            border: 1px solid var(--border); background: var(--surface);
            cursor: pointer; color: var(--text);
        }
        .proj-tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    </style>
</head>
<body>
<nav>
    <a href="/" class="site-name">展覽位置預定系統</a>
    <div class="nav-links">
        <a href="/result.html" class="active">排位結果</a>
        <a href="/book.html" id="nav-book">填寫志願</a>
        <span class="nav-user" id="nav-user"></span>
        <a href="#" id="nav-logout" style="color:var(--danger);display:none">登出</a>
        <span class="refresh-dot" id="refresh-dot" title="自動更新中"></span>
    </div>
</nav>

<main class="wide">

    <!-- 登入提示 -->
    <div id="login-required" class="card" style="max-width:380px;margin:0 auto;display:none">
        <h2>請先登入</h2>
        <p class="page-subtitle">需要登入才能查看排位結果</p>
        <a href="/" class="btn btn-primary btn-block">前往登入</a>
    </div>

    <!-- 結果主體 -->
    <div id="result-body" style="display:none">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px">
            <div>
                <h1 style="margin-bottom:2px" id="page-title">排位結果</h1>
                <p class="page-subtitle" style="margin:0" id="update-subtitle">每 5 秒自動更新 &nbsp;·&nbsp; <span id="last-update">—</span></p>
            </div>
        </div>

        <!-- 專案選擇 -->
        <div id="proj-tabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px"></div>

        <!-- 平面圖 -->
        <div class="card" style="padding:16px; margin-bottom:16px">
            <div class="floorplan-container">
                <div class="floorplan-wrap" id="floorplan-wrap">
                    <img id="floorplan-img" alt="展館平面圖" style="display:block;width:100%;height:auto"
                         onerror="this.parentElement.innerHTML='<div style=\'padding:40px;text-align:center;color:var(--muted)\'>平面圖尚未設定</div>'">
                    <svg id="marker-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>
            <div class="legend" id="result-legend">
                <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>我的位置</div>
                <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>已分配</div>
                <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>
            </div>
        </div>

        <!-- 結果表格 -->
        <div class="result-grid">
            <div class="card">
                <h2>學生分配狀況</h2>
                <div id="student-table">載入中…</div>
            </div>
            <div class="card">
                <h2>位置分配狀況</h2>
                <div id="wall-table">載入中…</div>
            </div>
        </div>
    </div>
</main>

<footer>
    © <span id="yr"></span> hui.gallery &nbsp;·&nbsp; 如需技術協助，請洽 <a href="mailto:service@hui.gallery">service@hui.gallery</a>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

// 支援學生帳號（localStorage）或管理員帳號（sessionStorage）
const isAdmin = !!sessionStorage.getItem('hui_admin_token');
const token = isAdmin
    ? sessionStorage.getItem('hui_admin_token')
    : localStorage.getItem('hui_token');
const myName = isAdmin
    ? ('管理員' + (sessionStorage.getItem('hui_admin_role') === 'superadmin' ? '（超）' : ''))
    : localStorage.getItem('hui_name');
const expiresAt = parseInt(
    (isAdmin ? sessionStorage.getItem('hui_admin_expires_at') : localStorage.getItem('hui_expires_at')) || '0'
);

if (token && expiresAt && Date.now() / 1000 > expiresAt) {
    if (isAdmin) { sessionStorage.removeItem('hui_admin_token'); sessionStorage.removeItem('hui_admin_expires_at'); }
    else { localStorage.removeItem('hui_token'); localStorage.removeItem('hui_name'); localStorage.removeItem('hui_expires_at'); }
}
// 每分鐘檢查一次是否過期
setInterval(() => {
    const exp = parseInt((isAdmin ? sessionStorage.getItem('hui_admin_expires_at') : localStorage.getItem('hui_expires_at')) || '0');
    if (exp && exp < Date.now() / 1000) {
        if (isAdmin) { sessionStorage.clear(); window.location.href = '/admin.html'; }
        else { localStorage.clear(); window.location.href = '/'; }
    }
}, 60000);

if (!token || (expiresAt && Date.now() / 1000 > expiresAt)) {
    document.getElementById('login-required').style.display = '';
} else {
    const navUser = document.getElementById('nav-user');
    if (isAdmin) {
        navUser.innerHTML = `<a href="/admin.html" style="color:var(--text)">${myName || '管理員'}</a>`;
        document.getElementById('nav-book').style.display = 'none';
        document.getElementById('result-legend').innerHTML = `
            <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>已分配（管理員檢視，無我的位置）</div>
            <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>`;
    } else {
        navUser.textContent = myName || '';
    }
    document.getElementById('nav-logout').style.display = '';
    document.getElementById('result-body').style.display = '';
    init();
}

document.getElementById('nav-logout')?.addEventListener('click', e => {
    e.preventDefault();
    if (isAdmin) { sessionStorage.clear(); window.location.href = '/admin.html'; }
    else { localStorage.clear(); window.location.href = '/'; }
});

let WALLS = {};
let selectedProjectId = null;
let openProjects = [];

async function init() {
    // 載入開放中的專案列表
    try {
        const r = await fetch('/api/open-projects');
        if (r.ok) {
            openProjects = (await r.json()).projects || [];
            renderProjTabs();
            if (openProjects.length > 0) {
                selectProject(openProjects[0].id);
            }
        }
    } catch { /* 忽略 */ }
}

function renderProjTabs() {
    const el = document.getElementById('proj-tabs');
    if (openProjects.length <= 1) { el.style.display = 'none'; return; }
    el.innerHTML = openProjects.map(p =>
        `<button class="proj-tab" id="tab-${p.id}" onclick="selectProject(${p.id})">${esc(p.name)}</button>`
    ).join('');
}

function selectProject(projectId) {
    selectedProjectId = projectId;
    document.querySelectorAll('.proj-tab').forEach(t => t.classList.remove('active'));
    const tab = document.getElementById(`tab-${projectId}`);
    if (tab) tab.classList.add('active');

    const proj = openProjects.find(p => p.id === projectId);
    const closed = proj?.close_at && Date.now() / 1000 > proj.close_at;
    document.getElementById('refresh-dot').style.display = closed ? 'none' : '';
    document.getElementById('update-subtitle').innerHTML = closed
        ? '志願已截止'
        : '每 5 秒自動更新 &nbsp;·&nbsp; <span id="last-update">—</span>';

    refresh();
}

function renderMarkers(taken) {
    const svg = document.getElementById('marker-svg');
    svg.innerHTML = '';
    const wrap = document.getElementById('floorplan-wrap');
    const r = Math.max(10, Math.min(16, wrap.offsetWidth * 0.016));
    const fs = Math.round(r * 0.85);

    for (const [id, pos] of Object.entries(WALLS)) {
        const wallId = parseInt(id);
        const assignedTo = taken[wallId];
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        const isMe = !isAdmin && assignedTo && assignedTo === myName;
        const fillColor = isMe
            ? '#16a34a'
            : assignedTo ? (isAdmin ? '#16a34a' : '#d97706') : 'rgba(120,120,120,0.45)';

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x + '%'); circle.setAttribute('cy', pos.y + '%');
        circle.setAttribute('r', isMe ? r * 1.15 : r);
        circle.setAttribute('fill', fillColor);
        circle.setAttribute('stroke', isMe ? '#fff' : '#fff');
        circle.setAttribute('stroke-width', isMe ? '2.5' : '1.5');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x + '%'); text.setAttribute('y', pos.y + '%');
        text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff'); text.setAttribute('font-size', fs);
        text.setAttribute('font-family', 'Inter, sans-serif'); text.setAttribute('font-weight', '700');
        text.setAttribute('pointer-events', 'none'); text.textContent = wallId;
        g.appendChild(circle); g.appendChild(text);

        if (assignedTo) {
            const nameEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const nameY = parseFloat(pos.y) + (r / wrap.offsetHeight * 100) + 2.5;
            nameEl.setAttribute('x', pos.x + '%'); nameEl.setAttribute('y', nameY + '%');
            nameEl.setAttribute('text-anchor', 'middle'); nameEl.setAttribute('fill', 'var(--text)');
            nameEl.setAttribute('font-size', Math.max(8, fs * 0.75));
            nameEl.setAttribute('font-family', 'Inter, sans-serif'); nameEl.setAttribute('font-weight', '500');
            nameEl.setAttribute('pointer-events', 'none');
            nameEl.textContent = assignedTo.length > 4 ? assignedTo.slice(0, 4) + '…' : assignedTo;
            g.appendChild(nameEl);
        }
        svg.appendChild(g);
    }
}

function renderStudentTable(results, allUsers) {
    const el = document.getElementById('student-table');
    if (!allUsers.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無資料</p>'; return; }
    let html = '<table><thead><tr><th>姓名</th><th>分配位置</th><th>提交時間</th></tr></thead><tbody>';
    for (const name of allUsers) {
        const r = results[name];
        if (r) {
            const d = new Date(r.submitted_at * 1000);
            const time = d.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit' });
            const rankLabel = r.rank ? `<span class="rank-badge">第${r.rank}志願</span>` : '';
            html += `<tr><td>${esc(name)}</td><td>位置 ${r.wall} ${rankLabel}</td><td style="color:var(--muted);font-size:13px">${time}</td></tr>`;
        } else {
            html += `<tr><td>${esc(name)}</td><td class="unsubmitted">尚未填寫</td><td>—</td></tr>`;
        }
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

function renderWallTable(taken) {
    const el = document.getElementById('wall-table');
    const wallIds = Object.keys(WALLS).map(Number).sort((a, b) => a - b);
    if (!wallIds.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無位置資料</p>'; return; }
    let html = '<table><thead><tr><th>位置</th><th>分配給</th></tr></thead><tbody>';
    for (const id of wallIds) {
        const name = taken[id];
        html += `<tr><td>位置 ${id}</td><td>${name ? esc(name) : '<span class="unsubmitted">—</span>'}</td></tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function refresh() {
    if (!selectedProjectId) return;
    try {
        const r = await fetch(`/api/result?projectId=${selectedProjectId}`);
        if (!r.ok) return;
        const { taken, results, allUsers, project } = await r.json();

        if (project) {
            WALLS = project.walls || {};
            const img = document.getElementById('floorplan-img');
            if (img.getAttribute('data-src') !== project.floorplan_url) {
                img.setAttribute('data-src', project.floorplan_url);
                img.onload = () => renderMarkers(taken);
                img.src = project.floorplan_url;
            } else {
                renderMarkers(taken);
            }
            document.getElementById('page-title').textContent = project.name ? `${project.name} — 排位結果` : '排位結果';
        }

        renderStudentTable(results, allUsers);
        renderWallTable(taken);

        const now = new Date();
        document.getElementById('last-update').textContent =
            `更新於 ${now.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    } catch { /* 靜默失敗 */ }
}

document.getElementById('floorplan-img').addEventListener('load', () => renderMarkers({}));

let refreshTimer = setInterval(() => {
    if (!selectedProjectId) return;
    // 若截止時間已過，停止自動刷新
    const proj = openProjects.find(p => p.id === selectedProjectId);
    if (proj?.close_at && Date.now() / 1000 > proj.close_at) {
        clearInterval(refreshTimer);
        document.getElementById('refresh-dot').style.display = 'none';
        document.getElementById('update-subtitle').textContent = '志願已截止';
        return;
    }
    refresh();
}, 5000);
</script>
</body>
</html>
