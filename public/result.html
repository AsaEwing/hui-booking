<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排位結果 — 地美展 位置預訂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
    <style>
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }
        .unsubmitted { color: var(--muted); font-style: italic; }
        .rank-badge {
            display: inline-block;
            font-size: 11px;
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: 4px;
            padding: 1px 6px;
            margin-left: 4px;
        }
    </style>
</head>
<body>
<nav>
    <a href="/" class="site-name">地美展 位置預訂</a>
    <div class="nav-links">
        <a href="/result.html" class="active">排位結果</a>
        <a href="/book.html">填寫志願</a>
        <span class="refresh-dot" id="refresh-dot" title="自動更新中"></span>
    </div>
</nav>

<main class="wide">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px">
        <div>
            <h1 style="margin-bottom:2px" id="page-title">目前排位結果</h1>
            <p class="page-subtitle" style="margin:0">每 5 秒自動更新 &nbsp;·&nbsp; <span id="last-update">—</span></p>
        </div>
    </div>

    <!-- 平面圖 -->
    <div class="card" style="padding:16px; margin-bottom:16px">
        <div class="floorplan-container">
            <div class="floorplan-wrap" id="floorplan-wrap">
                <img id="floorplan-img" alt="展館平面圖" style="display:block;width:100%;height:auto"
                     onerror="this.parentElement.innerHTML='<div style=\'padding:40px;text-align:center;color:var(--muted)\'>請將平面圖放置於 public/floorplan.jpg 或在管理員設定中指定網址</div>'">
                <svg id="marker-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot legend-dot-assigned"></div>已分配</div>
            <div class="legend-item"><div class="legend-dot legend-dot-unassigned"></div>未分配</div>
        </div>
    </div>

    <!-- 結果表格 -->
    <div class="result-grid">
        <div class="card">
            <h2>學生分配狀況</h2>
            <div id="student-table">載入中…</div>
        </div>
        <div class="card">
            <h2>位置分配狀況</h2>
            <div id="wall-table">載入中…</div>
        </div>
    </div>
</main>

<script>
let WALLS = {};

function renderMarkers(taken) {
    const svg = document.getElementById('marker-svg');
    svg.innerHTML = '';
    const wrap = document.getElementById('floorplan-wrap');
    const r = Math.max(10, Math.min(16, wrap.offsetWidth * 0.016));
    const fs = Math.round(r * 0.85);

    for (const [id, pos] of Object.entries(WALLS)) {
        const wallId = parseInt(id);
        const assignedTo = taken[wallId];
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x + '%');
        circle.setAttribute('cy', pos.y + '%');
        circle.setAttribute('r', r);
        circle.setAttribute('fill', assignedTo ? 'var(--accent)' : 'rgba(120,120,120,0.45)');
        circle.setAttribute('stroke', '#fff');
        circle.setAttribute('stroke-width', '1.5');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x + '%');
        text.setAttribute('y', pos.y + '%');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff');
        text.setAttribute('font-size', fs);
        text.setAttribute('font-family', 'Inter, sans-serif');
        text.setAttribute('font-weight', '700');
        text.setAttribute('pointer-events', 'none');
        text.textContent = wallId;

        g.appendChild(circle);
        g.appendChild(text);

        if (assignedTo) {
            const nameEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const nameY = parseFloat(pos.y) + (r / wrap.offsetHeight * 100) + 2.5;
            nameEl.setAttribute('x', pos.x + '%');
            nameEl.setAttribute('y', nameY + '%');
            nameEl.setAttribute('text-anchor', 'middle');
            nameEl.setAttribute('fill', 'var(--text)');
            nameEl.setAttribute('font-size', Math.max(8, fs * 0.75));
            nameEl.setAttribute('font-family', 'Inter, sans-serif');
            nameEl.setAttribute('font-weight', '500');
            nameEl.setAttribute('pointer-events', 'none');
            nameEl.textContent = assignedTo.length > 4 ? assignedTo.slice(0, 4) + '…' : assignedTo;
            g.appendChild(nameEl);
        }

        svg.appendChild(g);
    }
}

function renderStudentTable(results, allUsers) {
    const el = document.getElementById('student-table');
    if (!allUsers.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無資料</p>'; return; }

    let html = '<table><thead><tr><th>姓名</th><th>分配位置</th><th>提交時間</th></tr></thead><tbody>';
    for (const name of allUsers) {
        const r = results[name];
        if (r) {
            const d = new Date(r.submitted_at * 1000);
            const time = d.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit' });
            const rankLabel = r.rank ? `<span class="rank-badge">第${r.rank}志願</span>` : '';
            html += `<tr>
                <td>${esc(name)}</td>
                <td>位置 ${r.wall} ${rankLabel}</td>
                <td style="color:var(--muted);font-size:13px">${time}</td>
            </tr>`;
        } else {
            html += `<tr>
                <td>${esc(name)}</td>
                <td class="unsubmitted">尚未填寫</td>
                <td>—</td>
            </tr>`;
        }
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

function renderWallTable(taken) {
    const el = document.getElementById('wall-table');
    const wallIds = Object.keys(WALLS).map(Number).sort((a, b) => a - b);
    if (!wallIds.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">尚無位置資料</p>'; return; }
    let html = '<table><thead><tr><th>位置</th><th>分配給</th></tr></thead><tbody>';
    for (const id of wallIds) {
        const name = taken[id];
        html += `<tr>
            <td>位置 ${id}</td>
            <td>${name ? esc(name) : '<span class="unsubmitted">—</span>'}</td>
        </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function refresh() {
    try {
        const r = await fetch('/api/result');
        if (!r.ok) return;
        const { taken, results, allUsers, project } = await r.json();

        // 更新座標 & 圖片（只在有變化時）
        if (project) {
            WALLS = project.walls || {};
            const img = document.getElementById('floorplan-img');
            if (img.src !== new URL(project.floorplan_url, location.href).href) {
                img.src = project.floorplan_url;
            }
            document.getElementById('page-title').textContent = project.name
                ? `${project.name} — 排位結果`
                : '目前排位結果';
        }

        renderMarkers(taken);
        renderStudentTable(results, allUsers);
        renderWallTable(taken);

        const now = new Date();
        document.getElementById('last-update').textContent =
            `更新於 ${now.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    } catch { /* 靜默失敗，等下次更新 */ }
}

document.getElementById('floorplan-img').addEventListener('load', () => renderMarkers({}));
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
