<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填寫志願 — 展覽位置預定系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
    <style>
        .project-btn {
            display: block; width: 100%;
            text-align: left; padding: 12px 16px;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); cursor: pointer;
            margin-bottom: 8px; transition: border-color .15s, background .15s;
            font-size: 14px; color: var(--text);
        }
        .project-btn:hover { border-color: var(--accent); background: var(--card); }
        .project-btn.selected { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 2px var(--accent); }
        .project-btn .proj-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    </style>
</head>
<body>
<nav>
    <a href="/" class="site-name">展覽位置預定系統</a>
    <div class="nav-links">
        <a href="/result.html">查看排位</a>
        <span class="nav-user" id="nav-user"></span>
        <a href="#" id="nav-logout" style="color:var(--danger);display:none">登出</a>
    </div>
</nav>

<main class="wide">
    <!-- Step 1: 選擇專案 -->
    <div id="step-project" class="card">
        <h2>選擇報名專案</h2>
        <p class="page-subtitle">請選擇要填寫志願的展覽專案</p>
        <div id="project-list">載入中…</div>
        <div id="proj-select-alert" class="alert"></div>
        <button class="btn btn-primary btn-block" id="next-btn" style="margin-top:8px;display:none" onclick="goToStep2()">下一步 →</button>
    </div>

    <!-- Step 2: 填寫志願 -->
    <div id="step-book" style="display:none">
        <!-- 平面圖 -->
        <div class="card" style="padding:16px; margin-bottom:16px">
            <h3 id="book-proj-name" style="margin-bottom:10px"></h3>
            <div class="floorplan-container">
                <div class="floorplan-wrap" id="book-floorplan-wrap">
                    <img id="book-floorplan-img" alt="展館平面圖" style="display:block;width:100%;height:auto"
                         onerror="this.style.display='none'">
                    <svg id="book-marker-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>
        </div>

        <!-- 志願表單 -->
        <div class="card">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px">
                <button class="btn btn-ghost btn-sm" onclick="backToStep1()">← 返回</button>
                <h2 style="margin:0">填寫志願序</h2>
            </div>
            <p class="page-subtitle">請依照偏好順序填寫展牆位置，請對照上方平面圖選擇編號</p>

            <div id="time-banner" class="alert" style="display:none"></div>
            <div id="drive-banner" style="display:none;margin-bottom:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px">
                📁 <b>宣傳資料上傳</b>：<a id="drive-link" href="#" target="_blank" rel="noopener" style="color:var(--accent)">前往 Google Drive 資料夾上傳小冊子或宣傳資料 →</a>
            </div>
            <div id="status-banner" class="alert alert-info" style="display:none"></div>
            <div id="alert" class="alert"></div>

            <form id="book-form">
                <div id="prefs-container"></div>

                <div class="form-group" style="margin-top:8px">
                    <label>特殊需求備註 <span style="font-weight:400;color:var(--muted)">(選填，最多 500 字)</span></label>
                    <textarea id="note-input" rows="3" placeholder="例：需要至少 750 公分寬的位置、靠近出口等特殊需求" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:14px;resize:vertical"></textarea>
                </div>

                <div class="alert alert-warning" style="margin-top:4px; margin-bottom:16px">
                    ⚠️ 重新送出後，提交時間將更新，可能影響排位優先順序
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">送出志願</button>
            </form>

            <div id="retract-section" style="display:none;margin-top:8px">
                <button type="button" class="btn btn-ghost btn-block" id="retract-btn" style="color:var(--danger);border-color:var(--danger)" onclick="retractSubmission()">撤回志願</button>
                <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:4px">撤回後將從排位中移除，可重新填寫</p>
            </div>

            <hr>
            <a href="/result.html" class="btn btn-ghost btn-block" style="margin-top:0">查看目前排位結果 →</a>
        </div>
    </div>
</main>

<footer>
    © <span id="yr"></span> hui.gallery &nbsp;·&nbsp; 如需技術協助，請洽 <a href="mailto:service@hui.gallery">service@hui.gallery</a>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const token = localStorage.getItem('hui_token');
const myName = localStorage.getItem('hui_name');
const expiresAt = parseInt(localStorage.getItem('hui_expires_at') || '0');
if (!token || (expiresAt && Date.now() / 1000 > expiresAt)) {
    localStorage.removeItem('hui_token');
    localStorage.removeItem('hui_name');
    localStorage.removeItem('hui_expires_at');
    window.location.href = '/';
}
// 每分鐘檢查一次是否過期
setInterval(() => {
    if (parseInt(localStorage.getItem('hui_expires_at') || '0') < Date.now() / 1000) {
        localStorage.clear(); window.location.href = '/';
    }
}, 60000);

document.getElementById('nav-user').textContent = myName || '';
const logoutBtn = document.getElementById('nav-logout');
logoutBtn.style.display = '';
logoutBtn.addEventListener('click', e => {
    e.preventDefault();
    localStorage.clear();
    window.location.href = '/';
});

let openProjects = [];
let selectedProject = null;
let mySubmissions = {};
let WALLS = {};
let currentTaken = {};

// ── Step 1: 載入開放專案 ──
async function loadProjects() {
    try {
        const [pr, mr] = await Promise.all([
            fetch('/api/open-projects'),
            fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } }),
        ]);
        if (mr.status === 401) { localStorage.clear(); window.location.href = '/'; return; }

        openProjects = pr.ok ? (await pr.json()).projects : [];
        const meData = mr.ok ? await mr.json() : {};
        mySubmissions = meData.submissions || {};

        renderProjectList();

        // 若只有一個專案，直接選取
        if (openProjects.length === 1) {
            selectProject(openProjects[0]);
        }
    } catch { showProjAlert('載入失敗，請重新整理'); }
}

function renderProjectList() {
    const el = document.getElementById('project-list');
    if (!openProjects.length) {
        el.innerHTML = '<p style="color:var(--muted);font-size:13px">目前沒有開放報名的專案</p>';
        return;
    }
    const fmt = ts => new Date(ts * 1000).toLocaleString('zh-Hant', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    let html = '';
    for (const p of openProjects) {
        const submitted = mySubmissions[p.id];
        const submittedTag = submitted
            ? `<span style="color:var(--accent);font-weight:500">✓ 已提交</span>`
            : '';
        const now = Math.floor(Date.now() / 1000);

        // 狀態標籤
        let statusTag;
        if (p.close_at && now > p.close_at) {
            statusTag = `<span style="color:var(--danger);font-weight:500">已截止</span>`;
        } else if (p.open_at && now < p.open_at) {
            statusTag = `<span style="color:var(--warning, #d97706);font-weight:500">尚未開放</span>`;
        } else {
            statusTag = `<span style="color:var(--success, #16a34a);font-weight:500">開放報名</span>`;
        }

        // 開放時間列
        const openStr  = p.open_at  ? fmt(p.open_at)  : '無';
        const closeStr = p.close_at ? fmt(p.close_at) : '無';

        html += `<button class="project-btn" id="proj-btn-${p.id}" onclick="selectProject(${p.id})">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                <span style="font-weight:600">${esc(p.name)}</span>
                <span style="display:flex;gap:8px;align-items:center">${statusTag}${submittedTag}</span>
            </div>
            <div class="proj-meta">${p.wall_count} 個位置 &nbsp;·&nbsp; 共 ${p.pref_count || 5} 個志願</div>
            <div class="proj-meta" style="margin-top:2px">開始：${openStr}&nbsp;&nbsp;截止：${closeStr}</div>
        </button>`;
    }
    el.innerHTML = html;
}

function selectProject(projOrId) {
    const p = (typeof projOrId === 'number' || typeof projOrId === 'string')
        ? openProjects.find(x => x.id == projOrId)
        : projOrId;
    if (!p) return;
    selectedProject = p;
    document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('selected'));
    const btn = document.getElementById(`proj-btn-${p.id}`);
    if (btn) btn.classList.add('selected');
    document.getElementById('next-btn').style.display = '';

    if (openProjects.length === 1) goToStep2();
}

function goToStep2() {
    if (!selectedProject) return;
    document.getElementById('step-project').style.display = 'none';
    document.getElementById('step-book').style.display = '';
    loadStep2();
}

function backToStep1() {
    document.getElementById('step-book').style.display = 'none';
    document.getElementById('step-project').style.display = '';
}

// ── Step 2: 平面圖 + 表單 ──
async function loadStep2() {
    const p = selectedProject;
    document.getElementById('book-proj-name').textContent = p.name;

    // 載入平面圖、walls 和目前佔用狀況
    try {
        const r = await fetch(`/api/result?projectId=${p.id}`);
        if (r.ok) {
            const data = await r.json();
            WALLS = data.project?.walls || {};
            currentTaken = data.taken || {};
            const img = document.getElementById('book-floorplan-img');
            img.src = data.project?.floorplan_url || '';
            img.onload = () => renderWallMarkers();
        }
    } catch { /* 忽略 */ }

    // Drive 連結
    const driveBanner = document.getElementById('drive-banner');
    if (p.drive_url) {
        document.getElementById('drive-link').href = p.drive_url;
        driveBanner.style.display = '';
    } else {
        driveBanner.style.display = 'none';
    }

    // 建立下拉選單
    buildSelects(p.wall_count, p.pref_count || 5);

    // 時間限制 banner
    const now = Math.floor(Date.now() / 1000);
    const timeBanner = document.getElementById('time-banner');
    const fmt = ts => new Date(ts * 1000).toLocaleString('zh-Hant', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    if (p.open_at && now < p.open_at) {
        timeBanner.className = 'alert show alert-warning';
        timeBanner.textContent = `⏰ 志願填寫尚未開放，開放時間：${fmt(p.open_at)}`;
        document.getElementById('submit-btn').disabled = true;
    } else if (p.close_at && now > p.close_at) {
        timeBanner.className = 'alert show alert-error';
        timeBanner.textContent = `🔒 志願填寫已於 ${fmt(p.close_at)} 截止`;
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('retract-section').style.display = 'none';
    } else if (p.open_at || p.close_at) {
        timeBanner.className = 'alert show alert-info';
        const parts = [];
        if (p.open_at) parts.push(`開放：${fmt(p.open_at)}`);
        if (p.close_at) parts.push(`截止：${fmt(p.close_at)}`);
        timeBanner.textContent = `📅 ${parts.join('　')}`;
        timeBanner.style.display = '';
    }

    // 載入已有提交
    const sub = mySubmissions[p.id];
    if (sub) {
        const prefs = sub.prefs_json ? JSON.parse(sub.prefs_json) : [sub.pref1, sub.pref2, sub.pref3, sub.pref4, sub.pref5].filter(Boolean);
        prefs.forEach((v, i) => {
            const el = document.getElementById(`pref-${i + 1}`);
            if (el) el.value = v;
        });
        syncDisabledOptions();
        document.getElementById('note-input').value = sub.note || '';
        const d = new Date(sub.submitted_at * 1000);
        const banner = document.getElementById('status-banner');
        banner.style.display = '';
        banner.textContent = `✓ 已提交 — ${d.toLocaleDateString('zh-Hant')} ${d.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit' })}`;
        document.getElementById('retract-section').style.display = '';
    }
}

function renderWallMarkers() {
    const svg = document.getElementById('book-marker-svg');
    svg.innerHTML = '';
    const wrap = document.getElementById('book-floorplan-wrap');
    const r = Math.max(10, Math.min(16, wrap.offsetWidth * 0.016));
    const fs = Math.round(r * 0.85);

    for (const [id, pos] of Object.entries(WALLS)) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x + '%'); circle.setAttribute('cy', pos.y + '%');
        circle.setAttribute('r', r); circle.setAttribute('fill', 'rgba(80,80,80,0.55)');
        circle.setAttribute('stroke', '#fff'); circle.setAttribute('stroke-width', '1.5');
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x + '%'); text.setAttribute('y', pos.y + '%');
        text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff'); text.setAttribute('font-size', fs);
        text.setAttribute('font-family', 'Inter, sans-serif'); text.setAttribute('font-weight', '700');
        text.setAttribute('pointer-events', 'none'); text.textContent = id;
        g.appendChild(circle); g.appendChild(text); svg.appendChild(g);
    }
}

function wallLabel(w) {
    const isTaken = currentTaken[w] || currentTaken[String(w)];
    return isTaken ? `位置 ${w}  ·  已有人選` : `位置 ${w}`;
}

function buildSelects(wallCount, prefCount) {
    const container = document.getElementById('prefs-container');
    container.innerHTML = '';
    for (let i = 1; i <= prefCount; i++) {
        const div = document.createElement('div');
        div.className = 'form-group';
        const label = document.createElement('label');
        label.textContent = `第 ${i} 志願`;
        const select = document.createElement('select');
        select.id = `pref-${i}`; select.required = true;
        const placeholder = document.createElement('option');
        placeholder.value = ''; placeholder.textContent = '— 請選擇位置編號 —';
        placeholder.disabled = true; placeholder.selected = true;
        select.appendChild(placeholder);
        for (let w = 1; w <= wallCount; w++) {
            const opt = document.createElement('option');
            opt.value = w; opt.textContent = wallLabel(w);
            select.appendChild(opt);
        }
        select.addEventListener('change', syncDisabledOptions);
        div.appendChild(label); div.appendChild(select);
        container.appendChild(div);
    }
}

// 定時更新 taken 狀態（不影響已選值）
function updateSelectLabels() {
    document.querySelectorAll('#prefs-container select').forEach(sel => {
        Array.from(sel.options).forEach(opt => {
            const w = parseInt(opt.value);
            if (!w) return;
            opt.textContent = wallLabel(w);
        });
    });
    syncDisabledOptions();
}

function syncDisabledOptions() {
    const chosen = new Set();
    document.querySelectorAll('#prefs-container select').forEach(s => { if (s.value) chosen.add(s.value); });
    document.querySelectorAll('#prefs-container select').forEach(sel => {
        const own = sel.value;
        Array.from(sel.options).forEach(opt => {
            if (!opt.value) return;
            opt.disabled = chosen.has(opt.value) && opt.value !== own;
        });
    });
}

function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert' + (msg ? ` show alert-${type}` : '');
}

function showProjAlert(msg) {
    const el = document.getElementById('proj-select-alert');
    el.textContent = msg; el.className = 'alert show alert-error';
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('book-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!selectedProject) return;

    const prefs = [];
    document.querySelectorAll('#prefs-container select').forEach(sel => {
        const v = parseInt(sel.value);
        if (v) prefs.push(v);
    });
    const prefCount = selectedProject.pref_count || 5;
    if (prefs.length !== prefCount) { showAlert(`請選擇所有 ${prefCount} 個志願`); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '送出中…';

    try {
        const note = document.getElementById('note-input').value.trim().slice(0, 500);
        const r = await fetch('/api/book', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ prefs, projectId: selectedProject.id, note }),
        });
        const data = await r.json();
        if (!r.ok) { showAlert(data.error || '送出失敗'); return; }
        showAlert('✓ 志願已成功送出', 'success');
        mySubmissions[selectedProject.id] = { submitted_at: Math.floor(Date.now() / 1000), prefs_json: JSON.stringify(prefs), note };
        const banner = document.getElementById('status-banner');
        const d = new Date();
        banner.style.display = '';
        banner.textContent = `✓ 已提交 — ${d.toLocaleDateString('zh-Hant')} ${d.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit' })}`;
    } catch { showAlert('連線失敗，請稍後再試'); }
    finally { btn.disabled = false; btn.textContent = '送出志願'; }
});

async function retractSubmission() {
    if (!selectedProject) return;
    if (!confirm('確定要撤回志願嗎？撤回後將從排位中移除，可重新填寫。')) return;

    const btn = document.getElementById('retract-btn');
    btn.disabled = true; btn.textContent = '撤回中…';

    try {
        const r = await fetch('/api/retract', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId: selectedProject.id }),
        });
        const data = await r.json();
        if (!r.ok) { showAlert(data.error || '撤回失敗'); return; }

        delete mySubmissions[selectedProject.id];
        document.getElementById('status-banner').style.display = 'none';
        document.getElementById('retract-section').style.display = 'none';
        document.getElementById('note-input').value = '';
        document.querySelectorAll('#prefs-container select').forEach(s => s.value = '');
        syncDisabledOptions();
        showAlert('✓ 志願已撤回', 'success');
    } catch { showAlert('連線失敗，請稍後再試'); }
    finally { btn.disabled = false; btn.textContent = '撤回志願'; }
}

// 每 30 秒更新一次「已有人選」狀態
setInterval(async () => {
    if (!selectedProject) return;
    try {
        const r = await fetch(`/api/result?projectId=${selectedProject.id}`);
        if (r.ok) {
            const data = await r.json();
            currentTaken = data.taken || {};
            updateSelectLabels();
        }
    } catch { /* 忽略 */ }
}, 30000);

loadProjects();
</script>
</body>
</html>
