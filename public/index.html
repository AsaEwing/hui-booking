<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展覽位置預定系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
    <a href="/" class="site-name">展覽位置預定系統</a>
    <div class="nav-links">
        <a href="/result.html">查看排位</a>
    </div>
</nav>

<main>
    <div class="card">
        <h1>歡迎</h1>
        <p class="page-subtitle">請登入或設定帳號以填寫展牆志願</p>

        <div class="tabs">
            <button class="tab-btn active" data-tab="login">登入</button>
            <button class="tab-btn" data-tab="register">首次使用</button>
        </div>

        <div id="alert" class="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="login-name" placeholder="輸入你的姓名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="login-password" placeholder="輸入密碼" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">登入</button>
            <p style="text-align:center;margin-top:10px;font-size:13px">
                <a href="#" id="forgot-link" style="color:var(--muted)">忘記密碼？</a>
            </p>
        </form>

        <!-- 忘記密碼面板 -->
        <div id="forgot-panel" style="display:none">
            <hr style="margin:16px 0">
            <h3 style="font-size:15px;margin-bottom:4px">忘記密碼</h3>
            <p style="font-size:13px;color:var(--muted);margin-bottom:12px">請聯絡管理員協助重設。</p>
            <div id="forgot-email-row" style="display:none;margin-bottom:12px">
                <p style="font-size:13px;margin-bottom:6px">管理員聯絡信箱：</p>
                <p style="font-size:14px;font-weight:600" id="forgot-email-display"></p>
                <a id="forgot-mailto" href="#" class="btn btn-primary btn-sm" style="margin-top:8px;display:inline-block">開啟郵件 App 寄信</a>
                <p style="font-size:12px;color:var(--muted);margin-top:6px">若郵件 App 未開啟，請手動複製信箱寄信</p>
            </div>
            <div id="forgot-no-email" style="display:none">
                <p style="font-size:13px;color:var(--muted)">管理員尚未設定聯絡信箱，請直接聯絡老師或助教。</p>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('forgot-panel').style.display='none'">關閉</button>
        </div>

        <form id="register-form" style="display:none">
            <div class="form-group">
                <label>姓名（作為帳號識別）</label>
                <input type="text" id="reg-name" placeholder="例：郭書回、Shu-Hui Kuo、115郭書回" autocomplete="username">
                <p style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6">
                    可使用中文、英文或加入學號前綴（如 <b>115郭書回</b>）避免同名衝突。<br>
                    此姓名將顯示於排位結果，請確認後再送出。
                </p>
            </div>
            <div class="form-group">
                <label>設定密碼</label>
                <input type="password" id="reg-password" placeholder="至少 3 個字元" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>確認密碼</label>
                <input type="password" id="reg-confirm" placeholder="再次輸入密碼" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="register-btn">建立帳號</button>
        </form>
    </div>

    <p style="text-align:center; font-size:13px; color:var(--muted)">
        <a href="/result.html">直接查看目前排位結果 →</a>
        &nbsp;·&nbsp;
        <a href="/admin.html" style="color:var(--muted)">管理員</a>
    </p>
</main>

<footer>
    © <span id="yr"></span> hui.gallery &nbsp;·&nbsp; 如需技術協助，請洽 <a href="mailto:service@hui.gallery">service@hui.gallery</a>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
// 忘記密碼
document.getElementById('forgot-link').addEventListener('click', async e => {
    e.preventDefault();
    const panel = document.getElementById('forgot-panel');
    panel.style.display = '';
    try {
        const r = await fetch('/api/admin-contact');
        const { email } = await r.json();
        if (email) {
            document.getElementById('forgot-email-display').textContent = email;
            const subject = encodeURIComponent('密碼重設申請');
            const body = encodeURIComponent(`您好，\n\n我的帳號姓名為：（請填入你的姓名）\n\n請協助重設密碼，謝謝。`);
            document.getElementById('forgot-mailto').href = `mailto:${email}?subject=${subject}&body=${body}`;
            document.getElementById('forgot-email-row').style.display = '';
            document.getElementById('forgot-no-email').style.display = 'none';
        } else {
            document.getElementById('forgot-email-row').style.display = 'none';
            document.getElementById('forgot-no-email').style.display = '';
        }
    } catch {
        document.getElementById('forgot-no-email').style.display = '';
        document.getElementById('forgot-email-row').style.display = 'none';
    }
});

// 已登入則直接跳往填寫頁
if (localStorage.getItem('hui_token')) {
    window.location.href = '/book.html';
}

// Tab 切換
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
        document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
        showAlert('');
    });
});

function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert' + (msg ? ` show alert-${type}` : '');
}

function saveAndRedirect(token, name) {
    localStorage.setItem('hui_token', token);
    localStorage.setItem('hui_name', name);
    window.location.href = '/book.html';
}

// 登入
document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('login-name').value.trim();
    const password = document.getElementById('login-password').value;
    if (!name || !password) { showAlert('請填寫所有欄位'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '登入中…';

    try {
        const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, password }),
        });
        const data = await r.json();
        if (!r.ok) { showAlert(data.error || '登入失敗'); return; }
        saveAndRedirect(data.token, data.name);
    } catch { showAlert('連線失敗，請稍後再試'); }
    finally { btn.disabled = false; btn.textContent = '登入'; }
});

// 註冊
document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    if (!name || !password) { showAlert('請填寫所有欄位'); return; }
    if (password !== confirm) { showAlert('兩次密碼不一致'); return; }
    if (password.length < 3) { showAlert('密碼至少 3 個字元'); return; }

    const btn = document.getElementById('register-btn');
    btn.disabled = true; btn.textContent = '建立中…';

    try {
        const r = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, password }),
        });
        const data = await r.json();
        if (!r.ok) {
            const msg = data.error === '此姓名已被使用'
                ? '此姓名已有人使用，請換一個（可加學號前綴，例如 115郭書回）'
                : (data.error || '註冊失敗');
            showAlert(msg);
            return;
        }
        saveAndRedirect(data.token, data.name);
    } catch { showAlert('連線失敗，請稍後再試'); }
    finally { btn.disabled = false; btn.textContent = '建立帳號'; }
});
</script>
</body>
</html>
